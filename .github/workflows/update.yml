name: Update and publish OceanVeil catalog

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * *' # daily, UTC

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: oceanveil-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Offline parser and Stremio protocol tests
        run: python -m unittest discover -s tests -v
      - name: Update catalog with verified TMDB to IMDb matching
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          MAX_MATCHES_PER_RUN: '80'
          MAX_SEASONS_PER_TITLE: '12'
          MAX_EPISODES_PER_TITLE: '600'
        run: python build.py
      - name: Preserve titles between runs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Auto-update OceanVeil catalog state'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static Stremio addon
        id: deployment
        uses: actions/deploy-pages@v4
