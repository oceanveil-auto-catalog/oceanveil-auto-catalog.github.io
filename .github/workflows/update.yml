name: Update and publish OceanVeil catalog

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * *'  # ~8pm Pacific (site time)
    - cron: '15 18 * * *' # ~11am Pacific, after the site's 10:00 row changes

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: oceanveil-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Offline tests
        run: python -m unittest discover -s tests -v
      - name: Build catalog from OceanVeil's homepage and public API
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          ENRICH_MAX_NEW: '120'
          ENRICH_MAX_CALLS: '700'
        run: python build.py
      - name: Preserve titles between runs
        # Only scheduled/manual runs commit state, so your own pushes never get rejected.
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Auto-update OceanVeil catalog state'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static Stremio addon
        id: deployment
        uses: actions/deploy-pages@v4
